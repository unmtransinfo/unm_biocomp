# Production compose file for the public biocomp image.
#
# Single Tomcat container exposing only the selected J2EE apps:
#   Convert, Depict (ChemAxon), MolCloud, JSME (static).
#
# Reverse-proxy on the host should forward to 127.0.0.1:9095.

name: biocomp

services:
  biocomp:
    # On a pull-only production host the build section is ignored; it is here
    # for the maintainer who builds and pushes the public image.
    build:
      context: .
      dockerfile: Dockerfile
    image: unmtransinfo/biocomp:latest
    container_name: biocomp
    restart: unless-stopped

    # The legacy stack (Tomcat9, ChemAxon native x86 libs) is x86-only.
    # Run on an amd64 host, or under emulation on other architectures.
    platform: linux/amd64

    # Bind to loopback only; expose to the world via the host reverse proxy.
    ports:
      - "127.0.0.1:9095:8080"

    volumes:
      # ChemAxon license is supplied by the host, never committed or baked in.
      # This is the ONLY secret the container needs at runtime.
      - /var/lib/biocomp/chemaxon/license.cxl:/usr/share/tomcat9/webapps/biocomp/.chemaxon/license.cxl:ro

      # Persisted Tomcat access / catalina logs.
      - /var/log/biocomp:/usr/share/tomcat9/logs

    environment:
      TZ: America/Denver
      JAVA_OPTS: "-Xms512m -Xmx2g -Djava.awt.headless=true -Djava.security.egd=file:/dev/./urandom"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/biocomp/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    deploy:
      resources:
        limits:
          memory: 3g
